name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # macOS runners are sometimes short on capacity; this job reports but
  # never blocks a release.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/dji-offload \
            target/aarch64-apple-darwin/release/dji-offload \
            target/x86_64-apple-darwin/release/dji-offload
          dist/dji-offload --version
          tar -C dist -czf dji-offload-macos-universal.tar.gz dji-offload
          shasum -a 256 dji-offload-macos-universal.tar.gz > dji-offload-macos-universal.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dji-offload-macos-universal.tar.gz
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dji-offload-macos-universal.tar.gz dji-offload-macos-universal.tar.gz.sha256
