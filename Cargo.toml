[package]
name = "dji-offload"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Plug in a DJI drone: verified offload into dated, per-flight, parcel-tagged folders (offline Cochise County APN lookup)"
license = "Apache-2.0"
repository = "https://github.com/rafe-walker/dji-offload"
authors = ["Joshua Bryan"]
keywords = ["dji", "drone", "offload", "parcel", "macos"]

[dependencies]
anyhow = "1.0.105"
blake3 = "1.8.7"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
kamadak-exif = "0.6.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
